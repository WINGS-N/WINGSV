[package]
name = "wingsvd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wingsvd"
path = "src/main.rs"
test = false

# Deliberately tiny. Everything linked here runs as root for the life of the device,
# so the dependency list is the attack surface: std's UnixListener covers the abstract
# socket, threads cover the one client we ever serve, and libc is only needed because
# SO_PEERCRED has no stable std wrapper. No async runtime, no HTTP stack.
[dependencies]
libc = "0.2"
prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"
